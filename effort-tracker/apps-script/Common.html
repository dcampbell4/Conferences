<!-- Shared look and helpers for every page. Pulled in with include('Common'). -->
<style>
  :root {
    --navy: #2b2e83;
    --navy-dark: #1c1e5c;
    --lavender: #d9dbf1;
    --lavender-soft: #eef0fa;
    --page: #f6f7fb;
    --card: #ffffff;
    --ink: #1b1c38;
    --muted: #5b5e7e;
    --line: #dfe1ee;
    --ok: #1d7a45;
    --ok-bg: #e3f4ea;
    --warn: #a35a00;
    --warn-bg: #fff1d6;
    --bad: #b3261e;
    --bad-bg: #fde4e1;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(27, 28, 56, .06), 0 4px 14px rgba(27, 28, 56, .06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }

  /* Top bar with the Chapel wordmark */
  .bar {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 20px; padding-top: max(10px, env(safe-area-inset-top));
    background: var(--navy); color: #fff;
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }

  .brand-name { font: 700 18px/1 Georgia, "Times New Roman", serif; letter-spacing: .12em; }
  .brand-sub {
    margin-top: 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    background: var(--lavender); color: var(--navy); padding: 2px 6px; border-radius: 4px; display: inline-block;
  }
  .bar-title { flex: 1; font-size: 20px; font-weight: 600; text-align: center; }
  .bar-nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .bar-nav a, .bar-btn {
    color: #fff; text-decoration: none; padding: 8px 12px; border-radius: 8px;
    background: rgba(255,255,255,.12); border: 0; font-size: 15px;
  }
  .bar-nav a.current { background: #fff; color: var(--navy); font-weight: 600; }

  /* Buttons */
  .btn {
    border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600;
    background: var(--navy); color: #fff;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-soft { background: var(--lavender-soft); color: var(--navy); }
  .btn-danger { background: var(--bad-bg); color: var(--bad); }
  .btn-small { padding: 6px 10px; font-size: 14px; }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
  .muted { color: var(--muted); }

  /* Timer colours: green, then orange (warning), then red (overdue). Always with a word, not just colour. */
  .t-ok { color: var(--ok); }
  .t-warn { color: var(--warn); }
  .t-bad { color: var(--bad); }
  .chip-ok { background: var(--ok-bg); color: var(--ok); }
  .chip-warn { background: var(--warn-bg); color: var(--warn); }
  .chip-bad { background: var(--bad-bg); color: var(--bad); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 10px;
    box-shadow: var(--shadow); z-index: 50; max-width: 90vw; text-align: center;
  }
  .toast.error { background: var(--bad); }

  table.data { width: 100%; border-collapse: collapse; }
  table.data th, table.data td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  table.data th { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
</style>

<script>
  /** Calls a function in Code.gs and returns a Promise. Example: api('getKioskState', classId) */
  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) {
          var msg = (err && err.message) || String(err);
          reject(new Error(msg.replace(/^(Exception|Error):\s*/, '')));
        });
      runner[fn].apply(runner, args);
    });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function $(sel, root) { return (root || document).querySelector(sel); }

  var toastTimer;
  function toast(msg, isError) {
    var el = document.getElementById('toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
    el.className = 'toast' + (isError ? ' error' : '');
    el.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast hidden'; }, isError ? 5000 : 3000);
  }

  /** 125 seconds -> "2:05" */
  function clockText(ms) {
    var total = Math.max(0, Math.floor(ms / 1000));
    var m = Math.floor(total / 60), s = total % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  /** 'ok' | 'warn' | 'bad' for a time out of class, using the Settings tab. */
  function timerLevel(ms, settings) {
    var min = ms / 60000;
    if (min >= settings.overdueMinutes) return 'bad';
    if (min >= settings.warnMinutes) return 'warn';
    return 'ok';
  }
  var LEVEL_WORD = { ok: 'On time', warn: 'Running long', bad: 'Overdue' };

  function timeOfDay(ms) {
    return new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  function dayLabel(ms) {
    return new Date(ms).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function startOfWeek(d) { var x = startOfDay(d); var dow = (x.getDay() + 6) % 7; x.setDate(x.getDate() - dow); return x; }
</script>
